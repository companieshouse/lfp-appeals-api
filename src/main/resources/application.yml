server:
  port: 9000

spring:
  mongodb:
    uri: ${APPEALS_API_MONGODB_URL}

chips:
  enabled: ${CHIPS_FEATURE_ENABLED}
  restservice:
    url: ${CHIPS_REST_SERVICE_URL}

companyNumber:
  prefixes: ${ALLOWED_COMPANY_PREFIXES}

chs:
  kafka:
    api:
      url: ${KAFKA_API_URL:https://kafka-api.cidev.aws.chdev.org}
  api:
    key: ${CHS_API_KEY}

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /lfp-appeals-api
      path-mapping:
        health: healthcheck
  endpoint:
    health:
      show-details: never
      enabled: true
  opentelemetry:
    enabled: ${OTEL_LOG_ENABLED:false}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
    metrics:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
